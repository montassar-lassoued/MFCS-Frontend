<div class="side-menu">
  @for (m of menues; track m.id) {

  @if (m.menuTyp === 'group') {
  <div
    (click)="toggle(m)"
    [style.background]="'linear-gradient(to bottom, #ffffff 0%, ' + m.color + ' 100%)'"
    class="menu-item group-header"
    role="button"
  >
    <span class="menu-text">{{ m.name }}</span>
    <span [class.expanded]="m.expanded" class="arrow"></span>
  </div>

  @if (m.expanded) {
  <div class="children-container">
    @for (c of m.children; track c.id) {
    <div
      (click)="onItemClick(c, $event)"
      [style.background]="'linear-gradient(to bottom, #ffffff 0%, ' + c.color + ' 100%)'"
      class="menu-item child"
    >
      {{ c.name }}
    </div>
    }
  </div>
  }
  }

  @else if (m.menuTyp === 'item') {
  <div
    (click)="onItemClick(m, $event)"
    [style.background]="'linear-gradient(to bottom, #ffffff 0%, ' + m.color + ' 100%)'"
    class="menu-item"
    role="link"
  >
    {{ m.name }}
  </div>
  }

  } @empty {
  <p class="no-data">Keine Menüeinträge vorhanden.</p>
  }
</div>
